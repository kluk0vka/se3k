name: build
on:
  push:
    branches: [main]
    paths: ["services/**"]

jobs:
  build:
    runs-on: [self-hosted, staybook]
    strategy:
      matrix:
        service: [catalog-service, booking-service, inventory-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build and push with Kaniko
        run: |
          docker run --rm -v "$PWD/services:/workspace" \
            gcr.io/kaniko-project/executor:latest \
            --context=/workspace --dockerfile=/workspace/Dockerfile \
            --build-arg=SERVICE=${{ matrix.service }} \
            --destination=localhost:5000/staybook/${{ matrix.service }}:${{ github.sha }} \
            --insecure --skip-tls-verify
      - name: Bump chart image tag
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' charts/${{ matrix.service }}/values.yaml
