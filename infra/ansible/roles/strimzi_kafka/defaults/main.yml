strimzi_namespace: kafka
strimzi_chart_version: "1.2.0"
kafka_namespace: kafka
kafka_cluster_name: kafka
kafka_version: "4.3.1"
kafka_replicas: 3
kafka_replication_factor: 3
kafka_min_insync_replicas: 2
kafka_storage_size: 5Gi
kafka_storage_class: local-path
kafka_heap: 384m
kafka_resources:
  requests: {cpu: 200m, memory: 768Mi}
  limits: {memory: 1Gi}
kafka_topic_retention_ms: 604800000
kafka_topics:
  - {name: booking.requested, partitions: 6}
  - {name: booking.confirmed, partitions: 6}
  - {name: booking.cancelled, partitions: 6}
  - {name: inventory.held, partitions: 6}
  - {name: inventory.rejected, partitions: 6}
  - {name: inventory.released, partitions: 6}
  - {name: payment.succeeded, partitions: 6}
  - {name: payment.failed, partitions: 6}
  - {name: payment.refunded, partitions: 6}
  - {name: catalog.room-updated, partitions: 3}
kafka_connect_enabled: true
kafka_connect_name: archive-connect
kafka_connect_image: localhost:5000/staybook/kafka-connect:4.3.1-aiven-s3-3.4.3
kafka_connect_heap: 512m
kafka_connect_resources:
  requests: {cpu: 100m, memory: 768Mi}
  limits: {memory: 1Gi}
kafka_connect_credentials_secret: minio-archive-writer
archive_topics_regex: "^(booking|inventory|payment|catalog)\\..+"
archive_bucket: events-archive
archive_endpoint: http://minio.data.svc.cluster.local:9000
archive_flush_interval_ms: 30000
archive_file_max_records: 10000
