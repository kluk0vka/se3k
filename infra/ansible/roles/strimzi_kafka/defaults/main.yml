  - {name: booking.confirmed, partitions: 6}
  - {name: booking.cancelled, partitions: 6}
  - {name: inventory.held, partitions: 6}
  - {name: inventory.rejected, partitions: 6}
  - {name: inventory.released, partitions: 6}
  - {name: payment.succeeded, partitions: 6}
  - {name: payment.failed, partitions: 6}
  - {name: payment.refunded, partitions: 6}
  - {name: catalog.room-updated, partitions: 3}
