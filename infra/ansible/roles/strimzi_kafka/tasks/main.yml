- name: Install Strimzi cluster operator
  kubernetes.core.helm:
    name: strimzi
    chart_ref: oci://quay.io/strimzi-helm/strimzi-kafka-operator
    chart_version: "{{ strimzi_chart_version }}"
    release_namespace: "{{ strimzi_namespace }}"
    create_namespace: true
    wait: true
    values:
      watchNamespaces: "{{ [kafka_namespace] if kafka_namespace != strimzi_namespace else [] }}"
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 384Mi}

- name: Apply KafkaNodePool
  kubernetes.core.k8s:
    state: present
    namespace: "{{ kafka_namespace }}"
    server_side_apply:
      field_manager: ansible-strimzi
      force_conflicts: true
    template: nodepool.yaml.j2

- name: Apply Kafka cluster
  kubernetes.core.k8s:
    state: present
    namespace: "{{ kafka_namespace }}"
    server_side_apply:
      field_manager: ansible-strimzi
      force_conflicts: true
    template: kafka.yaml.j2
    wait: true
    wait_condition: {type: Ready, status: "True"}
    wait_timeout: 1200

- name: Apply topics
  kubernetes.core.k8s:
    state: present
    namespace: "{{ kafka_namespace }}"
    server_side_apply:
      field_manager: ansible-strimzi
      force_conflicts: true
    template: topics.yaml.j2
    wait: true
    wait_condition: {type: Ready, status: "True"}
    wait_timeout: 300

- name: Apply Kafka Connect cluster for the cold archive
  when: kafka_connect_enabled | bool
  kubernetes.core.k8s:
    state: present
    namespace: "{{ kafka_namespace }}"
    template: connect.yaml.j2
    server_side_apply:
      field_manager: ansible-strimzi
      force_conflicts: true
    wait: true
    wait_condition: {type: Ready, status: "True"}
    wait_timeout: 900

- name: Apply S3 sink connector to MinIO
  when: kafka_connect_enabled | bool
  kubernetes.core.k8s:
    state: present
    namespace: "{{ kafka_namespace }}"
    template: connector.yaml.j2
    server_side_apply:
      field_manager: ansible-strimzi
      force_conflicts: true
    wait: true
    wait_condition: {type: Ready, status: "True"}
    wait_timeout: 300
