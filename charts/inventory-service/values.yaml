replicaCount: 2
image:
  repository: localhost:5000/staybook/inventory-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  port: 8000
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 256Mi}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
kafka:
  bootstrapServers: kafka-kafka-bootstrap.kafka:9092
env:
  POSTGRES_HOST: postgres.data
  VALKEY_HOST: valkey.data
secretEnvFrom:
  - inventory-service-postgres
  - inventory-service-valkey
