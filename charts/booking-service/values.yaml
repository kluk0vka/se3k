replicaCount: 1
image:
  repository: localhost:5000/staybook/booking-service
  tag: "fc2f0eeccd"
  pullPolicy: IfNotPresent
service:
  port: 8000
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 256Mi}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
kafka:
  bootstrapServers: kafka-kafka-bootstrap.kafka:9092
env:
  POSTGRES_HOST: postgres.data
secretEnvFrom:
  - booking-service-postgres
mesh:
  enabled: true
  timeout: 5s
  retries:
    attempts: 2
    perTryTimeout: 2s
    retryOn: connect-failure,refused-stream,unavailable,cancelled,gateway-error,reset
  connectionPool:
    tcp:
      maxConnections: 100
      connectTimeout: 1s
    http:
      http1MaxPendingRequests: 50
      http2MaxRequests: 200
      maxRequestsPerConnection: 0
      maxRetries: 3
  outlierDetection:
    consecutive5xxErrors: 5
    consecutiveGatewayErrors: 3
    interval: 10s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
    minHealthPercent: 0
  fault: null
route:
  enabled: true
  pathPrefix: /bookings
  stripPrefix: false
  gateway:
    name: staybook-gateway
    namespace: edge
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: /metrics
otel:
  endpoint: http://otel-collector.observability.svc.cluster.local:4317
  sampler: parentbased_traceidratio
  rootSampleRatio: "0"
