apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
patches:
  - target: {kind: ConfigMap, name: argocd-cmd-params-cm}
    patch: |
      - op: add
        path: /data
        value:
          server.insecure: "true"
  - target: {kind: ConfigMap, name: argocd-cm}
    patch: |
      - op: add
        path: /data
        value:
          timeout.reconciliation: 60s
          kustomize.buildOptions: --enable-helm
  - target: {kind: Deployment, name: argocd-dex-server}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
  - target: {kind: Deployment, name: argocd-notifications-controller}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
