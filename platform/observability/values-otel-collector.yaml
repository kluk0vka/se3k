mode: deployment
replicaCount: 1
fullnameOverride: otel-collector
image:
  repository: otel/opentelemetry-collector-contrib
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 256Mi}
ports:
  metrics:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
    batch:
      send_batch_size: 1024
      timeout: 2s
  exporters:
    otlphttp/traces:
      endpoint: http://vtsingle-vm.observability.svc:10428/insert/opentelemetry
    otlphttp/metrics:
      endpoint: http://vmsingle-vm.observability.svc:8428/opentelemetry
    otlphttp/logs:
      endpoint: http://vlsingle-vm.observability.svc:9428/insert/opentelemetry
  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/traces]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/metrics]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/logs]
