apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook-logger
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-webhook-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-webhook-logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-webhook-logger
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:37
          env:
            - {name: HTTP_PORT, value: "8080"}
            - {name: LOG_WITHOUT_NEWLINE, value: "true"}
            - {name: LOG_IGNORE_PATH, value: /healthz}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook-logger
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: alert-webhook-logger
  ports:
    - {name: http, port: 8080, targetPort: 8080}
