  namespace: observability
spec:
  namespaceSelector:
    matchNames: [edge]
  selector:
    matchExpressions:
      - {key: gateway.networking.k8s.io/gateway-name, operator: Exists}
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_namespace]
