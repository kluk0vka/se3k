apiVersion: v1
kind: ConfigMap
metadata:
  name: kwok-provider-config
  namespace: kube-system
data:
  config: |-
    apiVersion: v1alpha1
    readNodesFrom: configmap
    nodegroups:
      fromNodeLabelKey: "kwok-nodegroup"
    configmap:
      name: kwok-provider-templates
    kwok:
      install: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kwok-provider-templates
  namespace: kube-system
data:
  templates: |-
    apiVersion: v1
    kind: List
    items:
    - apiVersion: v1
      kind: Node
      metadata:
        name: kwok-worker-template
        annotations:
          kwok.x-k8s.io/node: fake
          cluster-autoscaler.kwok.nodegroup/min-count: "0"
          cluster-autoscaler.kwok.nodegroup/max-count: "5"
        labels:
          kwok-nodegroup: kwok-worker
          kubernetes.io/arch: arm64
          kubernetes.io/os: linux
          kubernetes.io/hostname: kwok-worker-template
          type: kwok
      spec:
        taints:
        - key: kwok.x-k8s.io/node
          value: fake
          effect: NoSchedule
      status:
        allocatable:
          cpu: "2"
          memory: 4Gi
          pods: "110"
        capacity:
          cpu: "2"
          memory: 4Gi
          pods: "110"
        nodeInfo:
          architecture: arm64
          operatingSystem: linux
          kubeletVersion: fake
