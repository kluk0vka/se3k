apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
  namespace: data
data:
  valkey.conf: |
    maxmemory 192mb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    save ""
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: data
  labels:
    app.kubernetes.io/name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: tcp-valkey
      port: 6379
      targetPort: 6379
    - name: http-metrics
      port: 9121
      targetPort: 9121
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: data
  labels:
    app.kubernetes.io/name: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          args: ["/etc/valkey/valkey.conf", "--requirepass", "$(VALKEY_PASSWORD)"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: valkey-auth, key: VALKEY_PASSWORD}
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/valkey}
        - name: exporter
          image: oliver006/redis_exporter:v1.74.0
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: valkey-auth, key: VALKEY_PASSWORD}
          ports:
            - containerPort: 9121
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: config
          configMap:
            name: valkey-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
